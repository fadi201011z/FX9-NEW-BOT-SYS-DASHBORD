app = 'fx9-new-bot-sys-dashbord'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = 'dashdata'
  destination = '/data'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1