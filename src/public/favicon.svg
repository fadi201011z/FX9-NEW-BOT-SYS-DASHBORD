<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Kratos System">
  <defs>
    <!-- Deep purple to neon purple. The yellow from the brand duotone is added
         as an accent rule below: a full purple-to-yellow gradient behind the
         glyphs leaves the letterforms sitting on a pale corner, which reads
         badly at 16px. -->
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Brand initials -->
  <text x="16" y="22.5" text-anchor="middle" font-size="17" font-weight="800"
        fill="#ffffff" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.5">KR</text>
  <!-- Electric yellow accent rule -->
  <rect x="7" y="26" width="18" height="2" rx="1" fill="#f5e625"/>
</svg>
