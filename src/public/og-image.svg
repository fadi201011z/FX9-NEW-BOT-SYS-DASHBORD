<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kratos Dashboard — لوحة تحكم بوت KRS">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1e"/>
      <stop offset="50%" stop-color="#141033"/>
      <stop offset="100%" stop-color="#0a0b1e"/>
    </linearGradient>
    <!-- Brand duotone: neon purple to electric yellow, matching the landing page.
         Horizontal on purpose (y2=0%). These gradients fill the 6px accent bars,
         and a diagonal would resolve t from the bar's height, not its width —
         at the vertical midpoint t is already 0.5, so the whole bar renders as a
         flat 26% purple-yellow blend instead of a duotone sweep. -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f5e625"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowPu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowYe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e625" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f5e625" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="170" cy="300" r="340" fill="url(#glowPu)"/>
  <circle cx="1040" cy="340" r="290" fill="url(#glowYe)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- Accent bar at top -->
  <rect width="1200" height="6" fill="url(#brand)"/>

  <!-- Logo mark: brand initials -->
  <rect x="80" y="172" width="96" height="96" rx="24" fill="url(#mark)"/>
  <text x="128" y="239" text-anchor="middle" font-size="45" font-weight="800"
        fill="#ffffff" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1">KR</text>
  <rect x="80" y="276" width="96" height="5" rx="2.5" fill="#f5e625"/>

  <!-- Title -->
  <text x="80" y="356" font-size="54" font-weight="800" fill="#eef0f7" font-family="Arial, Helvetica, sans-serif">Kratos Dashboard</text>

  <!-- Subtitle -->
  <text x="80" y="406" font-size="24" fill="#9ea3ba" font-family="Arial, Helvetica, sans-serif">لوحة تحكم متقدمة لإدارة بوت KRS على ديسكورد</text>

  <!-- Status -->
  <circle cx="86" cy="462" r="7" fill="#57f287"/>
  <text x="104" y="469" font-size="18" fill="#9ea3ba" font-family="Arial, Helvetica, sans-serif">البوت متصل — جميع الأنظمة تعمل</text>

  <!-- Feature chips -->
  <g transform="translate(80, 502)">
    <rect x="0" y="0" width="176" height="38" rx="19" fill="rgba(168,85,247,0.14)" stroke="rgba(168,85,247,0.30)" stroke-width="1"/>
    <text x="88" y="25" text-anchor="middle" font-size="15" fill="#d8b4fe" font-family="Arial, Helvetica, sans-serif" font-weight="600">⚙️ إدارة متقدمة</text>

    <rect x="192" y="0" width="176" height="38" rx="19" fill="rgba(245,230,37,0.13)" stroke="rgba(245,230,37,0.30)" stroke-width="1"/>
    <text x="280" y="25" text-anchor="middle" font-size="15" fill="#f5e625" font-family="Arial, Helvetica, sans-serif" font-weight="600">🎫 نظام تذاكر</text>

    <rect x="384" y="0" width="176" height="38" rx="19" fill="rgba(168,85,247,0.14)" stroke="rgba(168,85,247,0.30)" stroke-width="1"/>
    <text x="472" y="25" text-anchor="middle" font-size="15" fill="#d8b4fe" font-family="Arial, Helvetica, sans-serif" font-weight="600">🔊 صوتيات</text>
  </g>

  <!-- Version badge -->
  <rect x="1020" y="44" width="104" height="34" rx="17" fill="rgba(168,85,247,0.14)" stroke="rgba(168,85,247,0.32)" stroke-width="1"/>
  <text x="1072" y="66" text-anchor="middle" font-size="14" fill="#d8b4fe" font-family="Arial, Helvetica, sans-serif" font-weight="700">v5.0.0</text>

  <!-- URL -->
  <text x="80" y="586" font-size="16" fill="#a855f7" font-family="Arial, Helvetica, sans-serif">kratos-botdashboard.onrender.com</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#brand)"/>
</svg>
